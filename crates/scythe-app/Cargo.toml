[package]
name = "scythe-app"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
rubberband = ["scythe-engine/rubberband"]
asio = ["scythe-engine/asio", "scythe-server/asio"]
itest = ["dep:egui_kittest"]

[dependencies]
scyeq-ui.workspace = true
scythe-core.workspace = true
scythe-decode.workspace = true
scythe-engine.workspace = true
scythe-session.workspace = true
scythe-server.workspace = true
scythe-surface.workspace = true
thiserror.workspace = true
base64.workspace = true
eframe.workspace = true
egui.workspace = true
rfd.workspace = true
realfft.workspace = true
mlua.workspace = true
serde.workspace = true
serde_json.workspace = true
ureq.workspace = true
sha2.workspace = true
getrandom.workspace = true
hound.workspace = true
rayon.workspace = true
image.workspace = true
egui_kittest = { version = "0.37.0", optional = true, features = ["snapshot", "wgpu"] }

[target.'cfg(windows)'.dependencies]
windows-sys.workspace = true
raw-window-handle = "0.6"

[target.'cfg(not(any(windows, target_os = "macos")))'.dependencies]
x11rb.workspace = true

[target.'cfg(windows)'.build-dependencies]
embed-resource = "3.0"
