[package]
name = "scythe-engine"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
# Rubber Band (GPL-2.0-or-later) as a pitch shifter, loaded from the system library at run time.
rubberband = []
# ASIO audio on Windows. Needs LLVM (libclang) to build; asio-sys fetches Steinberg's ASIO SDK,
# whose license binds whoever distributes the result.
asio = ["cpal/asio"]

[dependencies]
scythe-core.workspace = true
thiserror.workspace = true
arc-swap.workspace = true
rtrb.workspace = true
libloading.workspace = true
rayon.workspace = true
serde.workspace = true
serde_json.workspace = true
clap-sys.workspace = true
vst3.workspace = true
libc.workspace = true
realfft.workspace = true
rustfft.workspace = true
base64.workspace = true
cpal.workspace = true
symphonia.workspace = true
opus-pure.workspace = true
hound.workspace = true
flate2.workspace = true
midir.workspace = true
ab_glyph.workspace = true
image.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys.workspace = true

[target.'cfg(not(any(windows, target_os = "macos")))'.dependencies]
zbus.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
mach2.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
jack.workspace = true

[dev-dependencies]
x11rb.workspace = true
