[package]
name = "scyeq-plugin"
version.workspace = true
edition.workspace = true
license = "MIT OR Apache-2.0"
description = "ScyEQ-Pro as a CLAP and VST3 plugin"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
scyeq-dsp.workspace = true
scyeq-ui.workspace = true
plugin-format = { git = "https://github.com/tluijken/plugin-format", tag = "v0.1.2" }
# The portal (or zenity) on Linux, not GTK: a plugin must not run a GTK loop inside the host.
rfd = { version = "0.18.0", default-features = false, features = ["xdg-portal"] }
scythe-chooser.workspace = true
scythe-decode.workspace = true

[target.'cfg(unix)'.dependencies]
libc.workspace = true
raw-window-handle = "0.6.2"

[target.'cfg(all(unix, not(target_os = "macos")))'.dependencies]
x11rb.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6.0"
objc2-app-kit = { version = "0.3.0", default-features = false, features = ["std", "NSApplication", "NSResponder", "NSView", "NSWindow"] }

[target.'cfg(windows)'.dependencies]
windows-sys.workspace = true

[dev-dependencies]
base64.workspace = true
clap-sys.workspace = true
egui_kittest = "0.37.0"
hound.workspace = true
libloading.workspace = true
opus-pure.workspace = true
serde_json.workspace = true
vst3.workspace = true

# Run by scripts/reaper-compare.sh, not by cargo test: REAPER is not on CI.
[[example]]
name = "reaper_projects"
path = "tests/reaper/projects.rs"
