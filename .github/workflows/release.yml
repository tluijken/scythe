name: Release

# A pushed tag v<version> builds Scythe and the ScyEQ-Pro plugin for Linux, Windows and macOS and
# makes a draft release of them; docs/releasing.md says how. Run by hand it builds the same files
# as artifacts and makes no release.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - name: Tag matches the workspace version
        id: version
        env:
          TAG: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
        run: |
          version=$(scripts/release/version.sh ${TAG:+"$TAG"})
          echo "version=$version" >> "$GITHUB_OUTPUT"

  scythe:
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          # 22.04 for its older glibc, so the binaries run on most distributions.
          - os: ubuntu-22.04
            name: linux
            archive: tar.gz
          # Its image ships WiX 3, which cargo-wix needs.
          - os: windows-2022
            name: windows
            archive: zip
          - os: macos-latest
            name: macos
            archive: zip
    runs-on: ${{ matrix.os }}
    # Two hours to build, and one for signing to be approved.
    timeout-minutes: 180
    permissions:
      contents: read
      # To remove the unsigned Windows files once SignPath has signed them.
      actions: write
    env:
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@v4
      - name: System libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev libjack-jackd2-dev libx11-dev libxcb1-dev libxkbcommon-dev libgl1-mesa-dev libx11-xcb-dev libxcursor-dev libfontconfig1-dev
      - uses: dtolnay/rust-toolchain@stable
      - name: macOS targets
        if: runner.os == 'macOS'
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin
      # A prebuilt binary or nothing: without `fallback: none` an unsupported platform would
      # silently fetch the tool through cargo-binstall instead.
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-about@0.9.0
          fallback: none
      - uses: taiki-e/install-action@v2
        if: runner.os == 'Windows'
        with:
          tool: cargo-wix@0.3.9
      - name: WiX 3
        if: runner.os == 'Windows'
        shell: bash
        run: |
          if [ -z "${WIX:-}" ]; then
            choco install wixtoolset --version 3.14.1 -y --no-progress
            printf '%s\n' 'C:\Program Files (x86)\WiX Toolset v3.14\bin' >> "$GITHUB_PATH"
          fi
      - name: Package
        shell: bash
        run: scripts/release/package.sh dist
      # SignPath signs the MSI, the programs inside it and those in the zip
      # (.signpath/artifact-configuration.xml), once the repository has the SIGNPATH_ORGANIZATION_ID
      # variable and the SIGNPATH_API_TOKEN secret; without the variable the files stay unsigned.
      # A tag is signed with the release certificate, which waits for an approver in SignPath; a
      # run by hand with the test certificate.
      - name: Unsigned for SignPath
        id: unsigned
        if: runner.os == 'Windows' && vars.SIGNPATH_ORGANIZATION_ID != ''
        uses: actions/upload-artifact@v7
        with:
          name: windows-unsigned
          path: |
            dist/*.msi
            dist/*.zip
          retention-days: 1
          if-no-files-found: error
      - name: Sign
        if: steps.unsigned.outcome == 'success'
        uses: signpath/github-action-submit-signing-request@v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: scythe
          signing-policy-slug: ${{ github.ref_type == 'tag' && 'release-signing' || 'test-signing' }}
          artifact-configuration-slug: windows
          github-artifact-id: ${{ steps.unsigned.outputs.artifact-id }}
          parameters: |
            version: "${{ needs.version.outputs.version }}"
          wait-for-completion: true
          # Long enough for an approver to approve a release.
          wait-for-completion-timeout-in-seconds: 3600
          output-artifact-directory: dist-signed
      - name: Signed files in place of the unsigned
        if: steps.unsigned.outcome == 'success'
        shell: bash
        run: |
          cp -f dist-signed/*.msi dist-signed/*.zip dist/
          for f in dist/*.msi; do
            powershell -NoProfile -Command "\$s = Get-AuthenticodeSignature '$f'; \$s.Status; if (\$s.Status -ne 'Valid' -and '${{ github.ref_type }}' -eq 'tag') { exit 1 }"
          done
      # Otherwise the publish job would put the unsigned files in the release as well.
      - name: Remove the unsigned files
        if: always() && steps.unsigned.outputs.artifact-id != ''
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X DELETE "repos/${{ github.repository }}/actions/artifacts/${{ steps.unsigned.outputs.artifact-id }}"
      # Each file an artifact of its own, as it is rather than zipped once more.
      - uses: actions/upload-artifact@v7
        with:
          path: dist/*.${{ matrix.archive }}
          archive: false
          if-no-files-found: error
      - uses: actions/upload-artifact@v7
        if: runner.os == 'Windows'
        with:
          path: dist/*.msi
          archive: false
          if-no-files-found: error

  scyeq-plugin:
    needs: version
    uses: ./.github/workflows/scyeq-plugin.yml

  publish:
    needs: [version, scythe, scyeq-plugin]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
          # The zips are the release files: left as they are, not unpacked into dist.
          skip-decompress: true
      # Run again on its own, the job also downloads the SHA256SUMS of its first run.
      - name: Checksums
        working-directory: dist
        run: |
          rm -f SHA256SUMS
          sha256sum -- * > SHA256SUMS
          cat SHA256SUMS
      - uses: actions/upload-artifact@v7
        if: github.event_name != 'push'
        with:
          path: dist/SHA256SUMS
          archive: false
          overwrite: true
          if-no-files-found: error
      - name: Draft release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.version.outputs.version }}
        # A run again of this job alone finds the draft its first run made, and replaces the files.
        run: |
          draft=$(gh release view "$GITHUB_REF_NAME" --json isDraft --jq .isDraft 2>/dev/null || true)
          case "$draft" in
            true) gh release upload "$GITHUB_REF_NAME" --clobber dist/* ;;
            false) echo "$GITHUB_REF_NAME is already published" >&2; exit 1 ;;
            *) gh release create "$GITHUB_REF_NAME" --draft --generate-notes --title "Scythe $VERSION" dist/* ;;
          esac
