[workspace]
resolver = "3"
members = ["crates/scythe-core", "crates/scythe-engine", "crates/scythe-app", "crates/clap-test-gain", "crates/lv2-test-plugins", "crates/vst3-test-plugin", "crates/vst2-test-plugin"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
scythe-core = { path = "crates/scythe-core" }
scythe-engine = { path = "crates/scythe-engine" }
anyhow = "1.0.104"
thiserror = "2.0.21"
base64 = "0.23.1"
arc-swap = "1.9.3"
rtrb = "0.4.1"
libloading = "0.8"
rayon = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap-sys = "0.5"
vst3 = "0.3"
libc = "0.2"
x11rb = "0.13"
realfft = "3.5.1"
rustfft = "6.4.1"
cpal = "0.18.2"
symphonia = { version = "0.6.1", features = ["all"] }
hound = "3.5.1"
flate2 = { version = "1.1.11", default-features = false, features = ["zlib-rs"] }
midir = "0.11.1"
mlua = { version = "0.12.2", features = ["lua54", "vendored"] }
eframe = "0.37.0"
egui = "0.37.0"
rfd = "0.18.0"
ab_glyph = "0.2.32"
ureq = { version = "3.5.1", default-features = false, features = ["rustls"] }
sha2 = "0.10"
getrandom = "0.3"
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg"] }

[profile.dev.package."*"]
opt-level = 2
