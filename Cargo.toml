[workspace]
resolver = "3"
members = ["crates/scythe-core", "crates/scythe-engine", "crates/scythe-session", "crates/scythe-server", "crates/scythe-mcp", "crates/scythe-surface", "crates/scythe-app", "crates/scythe-itest", "crates/clap-test-gain", "crates/lv2-test-plugins", "crates/vst3-test-plugin", "crates/vst2-test-plugin"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
scythe-core = { path = "crates/scythe-core" }
scythe-engine = { path = "crates/scythe-engine" }
scythe-session = { path = "crates/scythe-session" }
scythe-server = { path = "crates/scythe-server" }
scythe-mcp = { path = "crates/scythe-mcp" }
scythe-surface = { path = "crates/scythe-surface" }
anyhow = "1.0.104"
thiserror = "2.0.21"
base64 = "0.23.1"
arc-swap = "1.9.3"
rtrb = "0.4.1"
libloading = "0.8"
rayon = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
schemars = "1.2.2"
clap-sys = "0.5"
vst3 = "0.3"
libc = "0.2"
x11rb = "0.13"
realfft = "3.5.1"
rustfft = "6.4.1"
cpal = { version = "0.18.2", features = ["jack", "pulseaudio"] }
jack = "0.13.5"
symphonia = { version = "0.6.1", features = ["all"] }
opus-pure = "0.2.3"
hound = "3.5.1"
flate2 = { version = "1.1.11", default-features = false, features = ["zlib-rs"] }
midir = "0.11.1"
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_System_Console", "Win32_System_LibraryLoader", "Win32_System_Threading", "Win32_UI_HiDpi", "Win32_UI_WindowsAndMessaging"] }
mlua = { version = "0.12.2", features = ["lua54", "vendored"] }
eframe = "0.37.0"
egui = "0.37.0"
rfd = "0.18.0"
ab_glyph = "0.2.32"
ureq = { version = "3.5.1", default-features = false, features = ["rustls"] }
sha2 = "0.10"
getrandom = "0.3"
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg"] }
axum = { version = "0.8.9", features = ["ws"] }
tokio = { version = "1.54.1", features = ["rt-multi-thread", "net", "sync", "time", "macros"] }
futures-util = { version = "0.3.34", default-features = false, features = ["sink", "std"] }
toml = "0.8.23"
tokio-tungstenite = "0.29.0"
zbus = { version = "5.19.0", default-features = false, features = ["async-io", "blocking-api"] }

[profile.dev.package."*"]
opt-level = 2

# The engine's DSP at opt-level 0 makes debug builds unusable with real projects (a live set
# loads 2.4x slower and renders at 2.4x the load); level 1 costs about 5 s per engine rebuild.
[profile.dev.package.scythe-engine]
opt-level = 1

# cpal with the ALSA period count settable (REAPER's `linux_audio_bufs`); see vendor/cpal.
[patch.crates-io]
cpal = { path = "vendor/cpal" }
